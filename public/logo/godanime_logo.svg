<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <!-- Fiery Orange & Amber Gradient -->
    <linearGradient id="godFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3800"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <!-- Warm Amber Gold Accent -->
    <linearGradient id="godAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Warm Orange Ambient Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(15, 18)">
    <!-- Outer Shield / Diamond -->
    <polygon points="50,4 96,28 96,76 50,100 4,76 4,28" fill="none" stroke="url(#godFire)" stroke-width="4.5" filter="url(#orangeGlow)"/>
    <polygon points="50,12 88,32 88,72 50,92 12,72 12,32" fill="#0b0b10" opacity="0.95"/>
    
    <!-- Stylized Kanji Symbol (神 - God) in Fiery Orange -->
    <path d="M36,36 L36,68 M30,48 L44,48 M56,32 L74,32 M65,32 L65,72 M52,48 L78,48 M52,62 L78,62 M50,22 L50,82" stroke="url(#godFire)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Apex Crown Diamond -->
    <polygon points="40,20 50,12 60,20 50,17" fill="#FBBF24" filter="url(#orangeGlow)"/>
  </g>

  <!-- Typography -->
  <!-- "GOD" in Fiery Magma Orange with Warm Radiant Glow -->
  <text x="135" y="77" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="url(#godFire)" letter-spacing="2" filter="url(#orangeGlow)">GOD</text>
  
  <!-- "ANIME" in Pure Crisp White -->
  <text x="265" y="77" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="3">ANIME</text>
  
  <!-- Subtitle Tagline in Warm Amber -->
  <text x="138" y="103" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FB923C" letter-spacing="6">STREAM FREE IN HD</text>

  <!-- Orange Ember Accent -->
  <circle cx="452" cy="71" r="5" fill="#FF7A00" filter="url(#orangeGlow)"/>
</svg>
